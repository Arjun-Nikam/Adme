services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: adme_db
      MYSQL_USER: adme_user
      MYSQL_PASSWORD: adme_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./adme_backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./adme_backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: local-dev-secret
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,192.168.7.9
      LOG_LEVEL: INFO
      DB_NAME: adme_db
      DB_USER: adme_user
      DB_PASSWORD: adme_pass
      DB_HOST: db
      DB_PORT: 3306
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:8081,http://192.168.7.9:8081,http://localhost:19006
      USE_S3: "False"
    depends_on:
      - db
      - redis

  celery_worker:
    build: ./adme_backend
    command: celery -A config worker -l info
    volumes:
      - ./adme_backend:/app
    environment:
      DJANGO_SECRET_KEY: local-dev-secret
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,192.168.7.9
      DB_NAME: adme_db
      DB_USER: adme_user
      DB_PASSWORD: adme_pass
      DB_HOST: db
      DB_PORT: 3306
      REDIS_URL: redis://redis:6379/0
      USE_S3: "False"
    depends_on:
      - db
      - redis

  celery_beat:
    build: ./adme_backend
    command: celery -A config beat -l info
    volumes:
      - ./adme_backend:/app
    environment:
      DJANGO_SECRET_KEY: local-dev-secret
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,192.168.7.9
      DB_NAME: adme_db
      DB_USER: adme_user
      DB_PASSWORD: adme_pass
      DB_HOST: db
      DB_PORT: 3306
      REDIS_URL: redis://redis:6379/0
      USE_S3: "False"
    depends_on:
      - db
      - redis

  # Web preview of the Expo app (Metro web dev server). iOS/Android are run on
  # the host with `npx expo start` — see adme_frontend/README.md.
  frontend:
    build: ./adme_frontend
    command: npx expo start --web --port 8081
    environment:
      EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    volumes:
      - ./adme_frontend:/app
      - /app/node_modules
    ports:
      - "8081:8081"
    depends_on:
      - backend

volumes:
  mysql_data:
