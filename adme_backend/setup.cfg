[flake8]
# 120 keeps the existing scaffold (some model FK lines run ~110) green while
# still catching genuinely long lines. Black is configured at 88; run it before
# opening a PR and new code will sit well under this ceiling.
max-line-length = 120
extend-ignore = E203,W503
exclude =
    .git,
    __pycache__,
    */migrations/*,
    venv,
    .venv,
    staticfiles
per-file-ignores =
    __init__.py:F401
    config/settings/*.py:F401,F403,F405

[tool:pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = test_*.py tests_*.py *_test.py
addopts = -ra

[tool:black]
line-length = 88
