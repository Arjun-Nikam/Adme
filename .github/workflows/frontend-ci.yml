name: Frontend CI
on:
  pull_request:
    paths: ["adme_frontend/**", ".github/workflows/frontend-ci.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adme_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run export:web
        env:
          EXPO_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
